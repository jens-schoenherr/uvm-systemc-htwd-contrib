<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>fc4sc coverage table</title>
<style>
body {
  font-family: monospace;
  font-size: 1rem;
}

table#cg_table {
  border-spacing: 0;
  border-collapse: separate;
  border-top: 1px solid black;
  border-left: 1px solid black;
  margin-bottom: 32px;
}

table#cg_table td, table#cg_table th {
  border: 0;
  border-right: 1px solid black;
  border-bottom: 1px solid black;
}

.cvp {
  font-size: 120%;
  font-weight: bold;
}

.cg_inst {
  font-size: 170%;
  font-weight: bold;
}

.bin_fail {
  color : red;
  font-weight: bold;
  left: 30%;
}

.bin_pass {
  color : green;
  font-weight: bold;
  left: 30%;
}

.bin_illegal {
  color : #77d47a;
  font-weight: bold;
  left: 30%;
}

table#cg_table {
  width: 100%;
  overflow-x: inherit
}

td,tr,th {
  text-align: center;
  border: 1px solid black;
}

.my_div {
  width: 100%;
  max-width: 1000px;
  box-sizing: border-box;
  position:absolute;
  left:50%;
  padding:15px;
  -ms-transform: translateX(-50%);
  -webkit-transform: translate(-50%,0%);
  transform: translate(-50%,0%);
}

.pct {
  font-size: 200%;
}

.pct_excluded {
  color: gray;
}

.pct_empty {
  color: red;
}

.pct_partial {
  color: #ebc944;
}

.pct_full {
  color: green;
}
</style>
</head>
<body>
<div id="file-content" class="my_div">

<div style="text-align: center;" id="scope_wo_cvp">
<h1>scope_wo_cvp default_scope_module</h1>
<table id="cg_table">

<tr>
<th class="pct pct_empty" rowspan="1">0.0%</th>
<th class="cg_inst" colspan="5">wo_cvp_coverage wo_cvp</th>
</tr>
</table>
</div>
</div>
</body>
</html>
